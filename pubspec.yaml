name: calley
description: "A new Flutter project."
# Prevents the package from being accidentally published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  font_awesome_flutter: ^11.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/calley_logo.png
    - assets/images/dash_img.png
    - assets/images/home_image.png
    - assets/images/whats_star_logo.png
    - assets/images/circle.png